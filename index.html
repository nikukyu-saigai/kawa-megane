<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>川めがね｜今いる場所の危険を、地図で見る</title>
<meta name="description" content="雨雲レーダーと洪水浸水想定区域を地図に重ねて、今いる場所の危険を確認できます。近くの河川カメラにもすぐ飛べます。肉球災害対策事務局。">
<link rel="canonical" href="https://nikukyu-saigai.github.io/kawa-megane/">
<meta property="og:type" content="website">
<meta property="og:locale" content="ja_JP">
<meta property="og:title" content="川めがね｜今いる場所の危険を、地図で見る">
<meta property="og:description" content="雨雲レーダーと洪水浸水想定区域を地図に重ねて確認。近くの河川カメラへもすぐ。">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --navy:#16233F; --navy2:#0F1929; --gold:#C9A75A; --cream:#F6F1E5;
    --danger:#C0392B; --pad: env(safe-area-inset-bottom, 0px);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
       background:var(--navy2);color:var(--cream);overflow:hidden}
  #map{position:absolute;inset:0}

  /* ---- 上部バー ---- */
  header{position:absolute;top:0;left:0;right:0;z-index:1000;
    background:linear-gradient(180deg,rgba(15,25,41,.94),rgba(15,25,41,.80) 70%,transparent);
    padding:10px 14px 22px}
  .ttl{display:flex;align-items:baseline;gap:10px}
  .ttl b{font-size:18px;letter-spacing:.04em}
  .ttl span{font-size:11px;letter-spacing:.18em;color:var(--gold)}
  .warn{margin-top:6px;font-size:12px;line-height:1.5;color:#FFD9D4}
  .warn b{color:#FF8A7A}

  /* ---- レイヤー切替 ---- */
  #layers{position:absolute;z-index:1000;right:10px;top:92px;display:flex;flex-direction:column;gap:8px}
  .lyr{appearance:none;border:1.5px solid rgba(201,167,90,.55);background:rgba(15,25,41,.86);
    color:var(--cream);font-size:12px;line-height:1.25;padding:9px 10px;border-radius:10px;
    width:106px;text-align:center;cursor:pointer;backdrop-filter:blur(4px)}
  .lyr small{display:block;font-size:10px;color:#9FB0C8;margin-top:3px}
  .lyr.on{background:var(--gold);color:#1B2A4A;border-color:var(--gold);font-weight:700}
  .lyr.on small{color:#4A3D1C}

  /* ---- 現在地 ---- */
  #locate{position:absolute;z-index:1000;right:10px;bottom:calc(126px + var(--pad));
    width:52px;height:52px;border-radius:50%;border:1.5px solid rgba(201,167,90,.55);
    background:rgba(15,25,41,.9);color:var(--cream);font-size:22px;cursor:pointer}

  /* ---- 下部アクション ---- */
  footer{position:absolute;left:0;right:0;bottom:0;z-index:1000;
    background:linear-gradient(0deg,rgba(15,25,41,.96),rgba(15,25,41,.86) 60%,transparent);
    padding:18px 10px calc(12px + var(--pad))}
  .acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:560px;margin:0 auto}
  .act{display:block;text-align:center;text-decoration:none;border-radius:12px;padding:11px 6px;
    font-size:12.5px;line-height:1.3;font-weight:700;border:1.5px solid rgba(201,167,90,.5);
    background:rgba(22,35,63,.92);color:var(--cream)}
  .act.pri{background:var(--gold);color:#1B2A4A;border-color:var(--gold)}
  .act small{display:block;font-weight:400;font-size:10px;color:#9FB0C8;margin-top:3px}
  .act.pri small{color:#4A3D1C}
  .note{max-width:560px;margin:8px auto 0;font-size:10.5px;line-height:1.6;color:#8FA0B8;text-align:center}
  .note a{color:#B9C7DA}

  /* ---- 雨雲の時刻 ---- */
  #rtime{position:absolute;z-index:1000;left:10px;top:92px;font-size:11px;
    background:rgba(15,25,41,.86);border:1px solid rgba(201,167,90,.35);
    padding:6px 9px;border-radius:8px;color:#CBD6E6}

  .me-tip{background:#E2453C;color:#fff;border:none;font-size:11px;font-weight:700;
    padding:3px 8px;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
  .me-tip::before{border-top-color:#E2453C !important}
  .leaflet-popup-content-wrapper{background:#16233F;color:#F6F1E5;border-radius:12px}
  .leaflet-popup-tip{background:#16233F}
  .leaflet-popup-content{margin:12px 14px;font-size:13px;line-height:1.6}
  .leaflet-popup-content a{display:inline-block;margin-top:8px;background:#C9A75A;color:#1B2A4A;
    text-decoration:none;font-weight:700;padding:7px 12px;border-radius:8px}
  /* 雨雲は乗算合成にして、地名・道路・川が透けるようにする */
  .rain-tiles{mix-blend-mode:multiply}
  /* 凡例 */
  #legend{position:absolute;z-index:1000;left:10px;bottom:calc(126px + var(--pad));
    background:rgba(15,25,41,.88);border:1px solid rgba(201,167,90,.35);border-radius:8px;
    padding:6px 8px;font-size:9.5px;color:#CBD6E6;line-height:1.35}
  #legend .row{display:flex;align-items:center;gap:5px;margin-top:2px}
  #legend i{width:14px;height:8px;border-radius:2px;display:inline-block}
  .leaflet-bottom.leaflet-left{bottom:calc(238px + var(--pad))}
  .leaflet-control-attribution{font-size:9px !important;background:rgba(255,255,255,.75) !important}
</style>
</head>
<body>

<div id="map"></div>

<header>
  <div class="ttl"><b>川めがね</b><span>NIKUKYU DISASTER BUREAU</span></div>
  <div class="warn"><b>避難指示（レベル4）以上が出ているときは、地図を見るより先に避難してください。</b></div>
</header>

<div id="rtime">雨雲を読み込み中…</div>

<div id="layers">
  <button class="lyr on" id="btnRain">雨雲<small>いま降っている</small></button>
  <button class="lyr" id="btnFlood">浸水想定<small>洪水で浸かる</small></button>
  <button class="lyr" id="btnDoseki">土砂<small>警戒区域</small></button>
</div>

<div id="legend">
  <div style="color:#E3C572;font-weight:700">雨の強さ</div>
  <div class="row"><i style="background:#A0D2FF"></i>弱い</div>
  <div class="row"><i style="background:#2B85EF"></i>やや強い</div>
  <div class="row"><i style="background:#FAF43C"></i>強い</div>
  <div class="row"><i style="background:#FF2800"></i>激しい</div>
</div>

<button id="locate" title="現在地へ">◎</button>

<footer>
  <div class="acts">
    <a class="act pri" id="camLink" href="https://www.river.go.jp/kawabou/pcfull/tm?zoomlevel=10&kind=camera" target="_blank" rel="noopener">
      近くの河川カメラ<small>国交省 川の防災情報</small></a>
    <a class="act" href="https://www.jma.go.jp/bosai/risk/" target="_blank" rel="noopener">
      洪水キキクル<small>気象庁 危険度分布</small></a>
    <a class="act" href="https://www.kawabou.mlit.go.jp/" target="_blank" rel="noopener">
      河川の水位<small>川の防災情報</small></a>
  </div>
  <div class="note">
    出典：<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル</a>／<a href="https://disaportal.gsi.go.jp/" target="_blank" rel="noopener">ハザードマップポータル</a>／気象庁<br>
    公式の防災情報ではありません。避難の判断は自治体・気象庁の発表に従ってください。
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ============================================================
   川めがね  —  肉球災害対策事務局
   地理院タイル + 気象庁ナウキャスト + 重ねるハザードマップ
   ============================================================ */

const map = L.map('map', {
  center: [35.7365, 139.5800],   // 初期表示：西武池袋線あたり
  zoom: 14,
  zoomControl: false,
  attributionControl: true
});
L.control.zoom({position:'bottomleft'}).addTo(map);

/* ---- ベース地図：地理院 淡色 ---- */
L.tileLayer('https://cyberjapandata.to.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
  attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">地理院タイル</a>',
  maxZoom: 18
}).addTo(map);

/* ---- 洪水浸水想定区域（想定最大規模） ---- */
const flood = L.tileLayer(
  'https://disaportaldata.gsi.go.jp/raster/01_flood_l2_shinsuishin_data/{z}/{x}/{y}.png',
  { opacity:0.62, maxNativeZoom:17, maxZoom:18,
    attribution:'<a href="https://disaportal.gsi.go.jp/" target="_blank">ハザードマップポータル</a>' });

/* ---- 土砂災害警戒区域（土石流） ---- */
const doseki = L.tileLayer(
  'https://disaportaldata.gsi.go.jp/raster/05_dosekiryukeikaikuiki/{z}/{x}/{y}.png',
  { opacity:0.62, maxNativeZoom:17, maxZoom:18 });

/* ---- 雨雲（気象庁ナウキャスト） ----------------------------
   ※ 気象庁が一般公開しているタイル配信を利用しています。
      公式APIとして案内されているものではないため、
      予告なく形式が変わる可能性があります。
------------------------------------------------------------ */
let rain = null;
async function loadRain(){
  const el = document.getElementById('rtime');
  try{
    const res = await fetch('https://www.jma.go.jp/bosai/jmatile/data/nowc/targetTimes_N1.json',{cache:'no-store'});
    const list = await res.json();
    // 実況（basetime === validtime）のうち最新のもの
    const now = list.filter(o => o.basetime === o.validtime).pop() || list[0];
    const url = `https://www.jma.go.jp/bosai/jmatile/data/nowc/${now.basetime}/none/${now.validtime}/surf/hrpns/{z}/{x}/{y}.png`;
    if (rain) map.removeLayer(rain);
    rain = L.tileLayer(url,{opacity:0.55, maxNativeZoom:10, maxZoom:18, zIndex:400, className:'rain-tiles'});
    if (document.getElementById('btnRain').classList.contains('on')) rain.addTo(map);
    const d = String(now.validtime).replace(/[^0-9]/g,''); // 例 20260909091000
    el.textContent = `雨雲 ${d.slice(4,6)}/${d.slice(6,8)} ${d.slice(8,10)}:${d.slice(10,12)} 時点`;
  }catch(e){
    el.textContent = '雨雲を取得できませんでした';
    document.getElementById('btnRain').classList.remove('on');
  }
}
loadRain();
setInterval(loadRain, 5*60*1000);   // 5分ごとに更新

/* ---- レイヤー切替 ---- */
function toggle(btnId, layer){
  const b = document.getElementById(btnId);
  b.addEventListener('click', ()=>{
    const on = b.classList.toggle('on');
    const L_ = (btnId==='btnRain') ? rain : layer;
    if(!L_) return;
    on ? L_.addTo(map) : map.removeLayer(L_);
  });
}
toggle('btnRain', null);
toggle('btnFlood', flood);
toggle('btnDoseki', doseki);

/* ---- 現在地 ---- */
let meMarker=null, meCircle=null;
function goHere(){
  if(!navigator.geolocation){ alert('この端末では現在地を取得できません'); return; }
  navigator.geolocation.getCurrentPosition(p=>{
    const ll=[p.coords.latitude, p.coords.longitude];
    map.setView(ll, 15);
    if(meMarker) map.removeLayer(meMarker);
    if(meCircle) map.removeLayer(meCircle);
    meCircle = L.circle(ll,{radius:Math.min(p.coords.accuracy,400),color:'#E2453C',weight:1.5,fillColor:'#E2453C',fillOpacity:.10}).addTo(map);
    meMarker = L.circleMarker(ll,{radius:11,color:'#fff',weight:4,fillColor:'#E2453C',fillOpacity:1,
                                  className:'me-dot'}).addTo(map).bindTooltip('現在地',{permanent:true,direction:'top',offset:[0,-12],className:'me-tip'});
    // 国交省の現在地周辺カメラへ座標を渡す
    document.getElementById('camLink').href =
      `https://www.river.go.jp/kawabou/pcfull/tm?zoomlevel=13&timeaxis=1&mapl=${ll[1]}%2C${ll[0]}&kind=camera`;
  }, ()=> alert('現在地を取得できませんでした。設定で位置情報を許可してください。'),
     {enableHighAccuracy:true, timeout:8000});
}
document.getElementById('locate').addEventListener('click', goHere);

/* ---- カメラ地点（cameras.json があれば地図に出す） ---------
   cameras.json の形：
   { "cameras":[
       {"name":"石神井川 豊石橋","river":"石神井川","pref":"東京都",
        "lat":35.7xxx,"lng":139.6xxx,"url":"https://...","source":"東京都建設局"}
   ]}
   lat / lng が入っているものだけピンになります。
------------------------------------------------------------ */
fetch('cameras.json',{cache:'no-store'})
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(d => {
    (d.cameras||[]).forEach(c=>{
      if(typeof c.lat!=='number' || typeof c.lng!=='number') return;
      L.circleMarker([c.lat,c.lng],{radius:8,color:'#fff',weight:2,
        fillColor:'#C9A75A',fillOpacity:1})
       .addTo(map)
       .bindPopup(
         `<b>${c.name}</b>` +
         (c.river?`<br>${c.river}`:'') +
         (c.source?`<br><span style="color:#9FB0C8;font-size:11px">${c.source}</span>`:'') +
         (c.url?`<br><a href="${c.url}" target="_blank" rel="noopener">映像を開く</a>`:'')
       );
    });
  })
  .catch(()=>{ /* cameras.json が無くても動く */ });

/* 起動時に現在地を試す（拒否されても地図は使える） */
goHere();
</script>
</body>
</html>
