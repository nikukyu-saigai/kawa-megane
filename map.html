<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>川めがね｜今いる場所の危険を、地図で見る</title>
<meta name="description" content="雨雲レーダーと洪水浸水想定区域を地図に重ねて、今いる場所の危険を確認できます。近くの河川カメラにもすぐ飛べます。肉球災害対策事務局。">
<link rel="canonical" href="https://nikukyu-saigai.github.io/kawa-megane/">
<meta property="og:type" content="website">
<meta property="og:locale" content="ja_JP">
<meta property="og:title" content="川めがね｜今いる場所の危険を、地図で見る">
<meta property="og:description" content="雨雲レーダーと洪水浸水想定区域を地図に重ねて確認。近くの河川カメラへもすぐ。">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --navy:#16233F; --navy2:#0F1929; --gold:#C9A75A; --cream:#F6F1E5;
    --pad: env(safe-area-inset-bottom, 0px);
    --footerH: 200px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
       background:var(--navy2);color:var(--cream);overflow:hidden}
  #map{position:absolute;inset:0}

  header{position:absolute;top:0;left:0;right:0;z-index:1000;
    background:linear-gradient(180deg,rgba(15,25,41,.94),rgba(15,25,41,.80) 70%,transparent);
    padding:10px 14px 22px}
  .ttl{display:flex;align-items:baseline;gap:10px}
  .ttl b{font-size:18px;letter-spacing:.04em}
  .ttl span{font-size:11px;letter-spacing:.18em;color:var(--gold)}
  .warn{margin-top:6px;font-size:12px;line-height:1.5;color:#FFD9D4}
  .warn b{color:#FF8A7A}

  #rtime{position:absolute;z-index:1000;left:10px;top:92px;font-size:11px;
    background:rgba(15,25,41,.86);border:1px solid rgba(201,167,90,.35);
    padding:6px 9px;border-radius:8px;color:#CBD6E6}
  #mapsrc{position:absolute;z-index:1000;left:10px;top:126px;font-size:10px;
    background:rgba(15,25,41,.8);border:1px solid rgba(201,167,90,.22);
    padding:4px 8px;border-radius:7px;color:#9FB0C8;max-width:calc(100vw - 130px)}

  #legend{position:absolute;z-index:1000;left:10px;top:158px;
    background:rgba(15,25,41,.86);border:1px solid rgba(201,167,90,.3);border-radius:8px;
    padding:5px 9px;font-size:10px;color:#CBD6E6;display:flex;align-items:center;gap:8px;
    flex-wrap:wrap;max-width:calc(100vw - 130px)}
  #legend .row{display:flex;align-items:center;gap:4px}
  #legend i{width:13px;height:8px;border-radius:2px;display:inline-block}

  #layers{position:absolute;z-index:1000;right:10px;top:92px;display:flex;flex-direction:column;gap:8px}
  .lyr{appearance:none;border:1.5px solid rgba(201,167,90,.55);background:rgba(15,25,41,.86);
    color:var(--cream);font-size:12px;line-height:1.25;padding:9px 10px;border-radius:10px;
    width:106px;text-align:center;cursor:pointer}
  .lyr small{display:block;font-size:10px;color:#9FB0C8;margin-top:3px}
  .lyr.on{background:var(--gold);color:#1B2A4A;border-color:var(--gold);font-weight:700}
  .lyr.on small{color:#4A3D1C}

  #locate{position:absolute;z-index:1000;right:10px;
    bottom:calc(var(--footerH) + var(--pad));
    width:52px;height:52px;border-radius:50%;border:1.5px solid rgba(201,167,90,.55);
    background:rgba(15,25,41,.9);color:var(--cream);font-size:22px;cursor:pointer}

  #toast{position:absolute;z-index:1200;left:50%;transform:translateX(-50%);
    bottom:calc(var(--footerH) + 8px + var(--pad));background:rgba(15,25,41,.96);
    border:1px solid rgba(201,167,90,.5);color:#F6F1E5;font-size:12px;line-height:1.5;
    padding:10px 14px;border-radius:10px;max-width:86vw;text-align:center;
    opacity:0;pointer-events:none;transition:opacity .25s}
  #toast.show{opacity:1}

  footer{position:absolute;left:0;right:0;bottom:0;z-index:1000;
    background:linear-gradient(0deg,rgba(15,25,41,.96),rgba(15,25,41,.86) 60%,transparent);
    padding:18px 10px calc(12px + var(--pad))}
  .acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:560px;margin:0 auto}
  .act{display:block;text-align:center;text-decoration:none;border-radius:12px;padding:11px 6px;
    font-size:12.5px;line-height:1.3;font-weight:700;border:1.5px solid rgba(201,167,90,.5);
    background:rgba(22,35,63,.92);color:var(--cream)}
  .act.pri{background:var(--gold);color:#1B2A4A;border-color:var(--gold)}
  .act small{display:block;font-weight:400;font-size:10px;color:#9FB0C8;margin-top:3px}
  .act.pri small{color:#4A3D1C}
  .note{max-width:560px;margin:8px auto 0;font-size:10.5px;line-height:1.6;color:#8FA0B8;text-align:center}
  .note a{color:#B9C7DA}

  .rain-tiles{mix-blend-mode:multiply}

  .me-tip{background:#E2453C;color:#fff;border:none;font-size:11px;font-weight:700;
    padding:3px 8px;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
  .me-tip::before{border-top-color:#E2453C !important}
  .leaflet-popup-content-wrapper{background:#16233F;color:#F6F1E5;border-radius:12px}
  .leaflet-popup-tip{background:#16233F}
  .leaflet-popup-content{margin:12px 14px;font-size:13px;line-height:1.6}
  .leaflet-popup-content a{display:inline-block;margin-top:8px;background:#C9A75A;color:#1B2A4A;
    text-decoration:none;font-weight:700;padding:7px 12px;border-radius:8px}
  .leaflet-bottom.leaflet-left{bottom:calc(var(--footerH) + var(--pad))}
  .leaflet-control-attribution{font-size:9px !important;background:rgba(255,255,255,.75) !important}
</style>
</head>
<body>

<div id="map"></div>

<header>
  <div class="ttl"><b>川めがね</b><span>NIKUKYU DISASTER BUREAU</span>
    <span style="margin-left:auto;color:#7E8CA3">v5</span></div>
  <div class="warn"><b>避難指示（レベル4）以上が出ているときは、地図を見るより先に避難してください。</b></div>
</header>

<div id="rtime">雨雲を読み込み中…</div>
<div id="mapsrc">地図を読み込み中…</div>

<div id="legend">
  <span style="color:#E3C572;font-weight:700">雨</span>
  <span class="row"><i style="background:#A0D2FF"></i>弱</span>
  <span class="row"><i style="background:#2B85EF"></i>やや強</span>
  <span class="row"><i style="background:#FAF43C"></i>強</span>
  <span class="row"><i style="background:#FF2800"></i>激しい</span>
</div>

<div id="layers">
  <button class="lyr on" id="btnRain">雨雲<small>いま降っている</small></button>
  <button class="lyr" id="btnFlood">浸水想定<small>洪水で浸かる</small></button>
  <button class="lyr" id="btnDoseki">土砂<small>警戒区域</small></button>
</div>

<button id="locate" title="現在地へ">◎</button>
<div id="toast"></div>

<footer>
  <div class="acts">
    <a class="act pri" id="camLink" href="https://www.river.go.jp/kawabou/pcfull/tm?zoomlevel=10&kind=camera" target="_blank" rel="noopener">
      近くの河川カメラ<small>国交省 川の防災情報</small></a>
    <a class="act" href="https://www.jma.go.jp/bosai/risk/" target="_blank" rel="noopener">
      洪水キキクル<small>気象庁 危険度分布</small></a>
    <a class="act" id="stgLink" href="https://www.river.go.jp/" target="_blank" rel="noopener">
      河川の水位<small>川の防災情報</small></a>
  </div>
  <div class="note">
    出典：<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル</a>／<a href="https://disaportal.gsi.go.jp/" target="_blank" rel="noopener">ハザードマップポータル</a>／気象庁<br>
    公式の防災情報ではありません。避難の判断は自治体・気象庁の発表に従ってください。
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ============================================================
   川めがね  —  肉球災害対策事務局
   地理院タイル / OpenStreetMap ＋ 気象庁ナウキャスト
   ＋ 重ねるハザードマップ（洪水浸水想定・土砂災害警戒区域）
   ============================================================ */

const map = L.map('map', { center:[35.7365,139.5800], zoom:14, zoomControl:false });
L.control.zoom({position:'bottomleft'}).addTo(map);

const srcEl   = document.getElementById('mapsrc');
const timeEl  = document.getElementById('rtime');
const toastEl = document.getElementById('toast');

function toast(msg, ms){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(function(){ toastEl.classList.remove('show'); }, ms || 4000);
}

/* ===== ベース地図：地理院タイル。読めなければ OpenStreetMap ===== */
let baseSwitched = false, gsiOk = 0, gsiErr = 0;

const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:19,
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>'
});
const gsi = L.tileLayer('https://cyberjapandata.to.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
  maxZoom:18,
  attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">地理院タイル</a>'
});

function useOSM(reason){
  if (baseSwitched) return;
  baseSwitched = true;
  if (map.hasLayer(gsi)) map.removeLayer(gsi);
  osm.addTo(map);
  osm.setZIndex(1);
  srcEl.textContent = '地図：OpenStreetMap（' + reason + '）';
}
gsi.on('tileload',  function(){ gsiOk++; if(!baseSwitched) srcEl.textContent = '地図：地理院タイル'; });
gsi.on('tileerror', function(){ gsiErr++; if(gsiErr>=4 && gsiOk===0) useOSM('地理院タイルが読めないため'); });
gsi.addTo(map);
gsi.setZIndex(1);
setTimeout(function(){ if(gsiOk===0) useOSM('地理院タイルが読めないため'); }, 6000);

/* ===== ハザードマップ ===== */
const flood = L.tileLayer(
  'https://disaportaldata.gsi.go.jp/raster/01_flood_l2_shinsuishin_data/{z}/{x}/{y}.png',
  { opacity:0.62, maxNativeZoom:17, maxZoom:18, zIndex:300,
    attribution:'<a href="https://disaportal.gsi.go.jp/" target="_blank">ハザードマップポータル</a>' });

const doseki = L.tileLayer(
  'https://disaportaldata.gsi.go.jp/raster/05_dosekiryukeikaikuiki/{z}/{x}/{y}.png',
  { opacity:0.62, maxNativeZoom:17, maxZoom:18, zIndex:300 });

/* ===== 雨雲（気象庁ナウキャスト） =====
   気象庁が公開している配信を利用しています。公式APIとして案内
   されたものではないため、形式が変わる可能性があります。      */
function fmtJMATime(v){
  const d = String(v).replace(/[^0-9]/g,'');
  if (d.length < 12) return '時刻不明';
  const iso = d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8)+'T'+d.slice(8,10)+':'+d.slice(10,12)+':00Z';
  let t = new Date(iso);
  const diffMin = (Date.now() - t.getTime())/60000;
  if (diffMin < -180) t = new Date(t.getTime() - 9*3600000);
  const f = new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',
    month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
  const ago = Math.max(0, Math.round((Date.now()-t.getTime())/60000));
  return f.format(t) + (ago<=90 ? '（'+ago+'分前）' : '');
}

let rain = null;
function loadRain(){
  fetch('https://www.jma.go.jp/bosai/jmatile/data/nowc/targetTimes_N1.json',{cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(list){
      const now = list.filter(function(o){ return o.basetime===o.validtime; }).pop()
                  || list[list.length-1];
      const url = 'https://www.jma.go.jp/bosai/jmatile/data/nowc/'+now.basetime+
                  '/none/'+now.validtime+'/surf/hrpns/{z}/{x}/{y}.png';
      const wasOn = document.getElementById('btnRain').classList.contains('on');
      if (rain) map.removeLayer(rain);
      rain = L.tileLayer(url,{opacity:0.55,maxNativeZoom:10,maxZoom:18,zIndex:400,className:'rain-tiles'});
      if (wasOn) rain.addTo(map);
      timeEl.textContent = '雨雲 ' + fmtJMATime(now.validtime);
    })
    .catch(function(){ timeEl.textContent = '雨雲を取得できませんでした'; });
}
loadRain();
setInterval(loadRain, 5*60*1000);

/* ===== レイヤー切替 ===== */
function bindToggle(id, getLayer){
  const b = document.getElementById(id);
  b.addEventListener('click', function(){
    const on = b.classList.toggle('on');
    const lyr = getLayer();
    if (!lyr) return;
    if (on) lyr.addTo(map); else map.removeLayer(lyr);
  });
}
bindToggle('btnRain',   function(){ return rain; });
bindToggle('btnFlood',  function(){ return flood; });
bindToggle('btnDoseki', function(){ return doseki; });

/* ===== 現在地 =====
   起動時は静かに取得（失敗しても警告を出さない）
   ボタンは高精度で取り直し、だめなら精度を落として再挑戦     */
let meMarker = null, meCircle = null;

function showMe(p, zoom){
  const ll = [p.coords.latitude, p.coords.longitude];
  map.setView(ll, zoom);
  if (meMarker) map.removeLayer(meMarker);
  if (meCircle) map.removeLayer(meCircle);
  meCircle = L.circle(ll,{radius:Math.min(p.coords.accuracy||120,400),
    color:'#E2453C',weight:1.5,fillColor:'#E2453C',fillOpacity:.10}).addTo(map);
  meMarker = L.circleMarker(ll,{radius:11,color:'#fff',weight:4,
    fillColor:'#E2453C',fillOpacity:1}).addTo(map)
    .bindTooltip('現在地',{permanent:true,direction:'top',offset:[0,-12],className:'me-tip'});
  document.getElementById('camLink').href =
    'https://www.river.go.jp/kawabou/pcfull/tm?zoomlevel=13&timeaxis=1&mapl='+
    ll[1]+'%2C'+ll[0]+'&kind=camera';
  var sl = document.getElementById('stgLink');
  if (sl) sl.href =
    'https://www.river.go.jp/kawabou/mb/tmlist?zm=13&clat='+ll[0]+'&clon='+ll[1]+
    '&fld=0&mapType=0&viewGrpStg=0&viewRd=1&viewRW=1&viewRl=1&viewRn=1&viewPoint=1&ext=0';
}

function geoMessage(e){
  if (e && e.code === 1) return '位置情報が許可されていません。ブラウザの設定で、このサイトに位置情報を許可してください。';
  if (e && e.code === 3) return '位置情報の取得に時間がかかっています。屋外や窓際でもう一度お試しください。';
  return '現在地を取得できませんでした。';
}

function locateQuiet(){
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    function(p){ showMe(p,15); },
    function(){},
    {enableHighAccuracy:false, timeout:15000, maximumAge:300000}
  );
}

function locateByUser(){
  if (!navigator.geolocation){ toast('この端末では現在地を取得できません'); return; }
  toast('現在地を探しています…', 20000);
  navigator.geolocation.getCurrentPosition(
    function(p){ showMe(p,16); toast('現在地を表示しました', 2000); },
    function(){
      navigator.geolocation.getCurrentPosition(
        function(p){ showMe(p,15); toast('現在地を表示しました（おおよその位置）', 3000); },
        function(e){ toast(geoMessage(e), 7000); },
        {enableHighAccuracy:false, timeout:15000, maximumAge:600000}
      );
    },
    {enableHighAccuracy:true, timeout:20000, maximumAge:0}
  );
}
document.getElementById('locate').addEventListener('click', locateByUser);

/* ===== カメラ地点（cameras.json があれば表示） =====
   lat / lng が数値のものだけピンになります。            */
fetch('cameras.json',{cache:'no-store'})
  .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
  .then(function(d){
    (d.cameras||[]).forEach(function(c){
      if (typeof c.lat !== 'number' || typeof c.lng !== 'number') return;
      L.circleMarker([c.lat,c.lng],{radius:8,color:'#fff',weight:2,
        fillColor:'#C9A75A',fillOpacity:1}).addTo(map)
       .bindPopup('<b>'+c.name+'</b>'
         + (c.river  ? '<br>'+c.river : '')
         + (c.source ? '<br><span style="color:#9FB0C8;font-size:11px">'+c.source+'</span>' : '')
         + (c.url    ? '<br><a href="'+c.url+'" target="_blank" rel="noopener">映像を開く</a>' : ''));
    });
  })
  .catch(function(){});

locateQuiet();
</script>
</body>
</html>
